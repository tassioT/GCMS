name: Update YouTrack Issue State

on:
  push:
    branches:
      - main

jobs:
  youtrack-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Extract commit messages
        id: commits
        run: |
          echo "COMMIT_MESSAGES<<EOF" >> $GITHUB_ENV
          git log -1 --pretty=%B >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Parse YouTrack issue IDs and states
        id: parse
        run: |
          echo "Parsing commit messages..."
          # Extrai todas as issues (formato PROJ-NUM)
          issues=$(echo "$COMMIT_MESSAGES" | grep -oE '[A-Z]+-[0-9]+' || true)
          # Extrai todos os estados que vêm com # e remove o #
          states=$(echo "$COMMIT_MESSAGES" | grep -oE '#[A-Za-z]+' || true | sed 's/^#//')
          
          echo "Found issues: $issues"
          echo "Found states: $states"
          echo "ISSUES=$issues" >> $GITHUB_ENV
          echo "STATES=$states" >> $GITHUB_ENV

      - name: Update YouTrack issues
        if: env.ISSUES != ''
        run: |
          # Convert strings to arrays
          IFS=' ' read -r -a issue_array <<< "$ISSUES"
          IFS=' ' read -r -a state_array <<< "$STATES"

          for idx in "${!issue_array[@]}"; do
            issue=${issue_array[$idx]}
            # Usa o estado correspondente ou padrão se não houver
            state=${state_array[$idx]:-"In Progress"}
            
            # Remove qualquer # que possa ter sobrado
            state=$(echo "$state" | sed 's/^#//')

            # Debug: mostrar no terminal
            echo "-----------------------------------------"
            echo "Issue: $issue"
            echo "State (sem #): $state"
            echo "JSON que será enviado:"
            echo "{ \"query\": \"$state\", \"issues\": [{\"idReadable\": \"$issue\"}] }"

            # Envia para o YouTrack
            curl -X POST "https://tvts.youtrack.cloud/api/commands" \
              -H "Authorization: Bearer ${{ secrets.YOUTRACK_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{ \"query\": \"$state\", \"issues\": [{\"idReadable\": \"$issue\"}] }"
          done