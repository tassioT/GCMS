      - name: Update YouTrack issues
        if: env.ISSUES != ''
        run: |
          # Converte strings em arrays
          issue_array=($ISSUES)
          state_array=($STATES)

          for idx in "${!issue_array[@]}"; do
            issue=${issue_array[$idx]}
            state=${state_array[$idx]:-In Progress}
            # Extrai comentário removendo ID e estado
            comment=$(echo "$COMMIT_MESSAGES" | sed -E "s/$issue//" | sed -E "s/$state//" | xargs)
            
            # Mostrar os parâmetros antes de enviar
            echo "-----------------------------------------"
            echo "Issue: $issue"
            echo "State: $state"
            echo "Comment: $comment"
            
            # Construir corpo JSON
            json_body=$(cat <<EOF
{
  "query": "$state",
  "issues": [{"idReadable": "$issue"}],
  "comment": "$comment"
}
EOF
)
            echo "JSON enviado para o curl:"
            echo "$json_body"

            # Chamada curl
            curl -X POST "https://tvts.youtrack.cloud/api/commands" \
              -H "Authorization: Bearer ${{ secrets.YOUTRACK_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "$json_body"
          done
