name: YouTrack Integration

on:
  push:
    branches:
      - main

jobs:
  youtrack-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update YouTrack Issue
        uses: actions/github-script@v6
        with:
          script: |
            const issueId = 'RAM-21'; // substitua pelo ID real
            const command = 'Done';
            const url = '${{ secrets.YOUTRACK_URL }}';
            const token = '${{ secrets.YOUTRACK_TOKEN }}';

            const response = await fetch(`${url}/api/issues/${issueId}/execute`, {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ command })
            });

            if (!response.ok) {
              throw new Error(`Failed to update issue: ${response.statusText}`);
            }
            console.log(`Issue ${issueId} updated successfully.`);
