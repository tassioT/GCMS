name: YouTrack Integration

on:
  push:
    branches: main
  pull_request:
    types: [opened, closed, reopened, edited]

jobs:
  youtrack-update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Update YouTrack issues
      uses: youtrack/youtrack-action@v1
      with:
        youtrack-url: ${{ secrets.YOUTRACK_URL }}
        youtrack-token: ${{ secrets.YOUTRACK_TOKEN }}
        message-template: |
          {user} {action} no GitHub: {issue}
          Commit: {commit}
          Branch: {branch}
          Link: {link}